[package]
name = "uemulator-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "uemulator"
path = "src/main.rs"

[features]
default = ["jit"]
jit = ["uemulator/jit"]

[dependencies]
uemulator = { path = "../uemulator", default-features = false }
clap = { version = "4", features = ["derive"] }
ureq = "3"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
