name: check

on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main

permissions:
  contents: read # Needed to checkout the repository.

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  # Only cancel superseded pull request runs, so every push to main is fully checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
    - name: harden runner
      uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
      with:
        egress-policy: audit

    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install firmware target
      run: rustup target add x86_64-unknown-none

    - name: cargo build
      run: cargo build --release --workspace

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
    - name: harden runner
      uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
      with:
        egress-policy: audit

    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install firmware target
      run: rustup target add x86_64-unknown-none

    - name: cargo test
      run: cargo test --release --workspace

    - name: cargo test without default features
      run: cargo test --release -p uemulator --no-default-features

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
    - name: harden runner
      uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
      with:
        egress-policy: audit

    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install clippy
      run: rustup component add clippy

    - name: install firmware target
      run: rustup target add x86_64-unknown-none

    - name: cargo clippy
      run: cargo clippy --release --workspace --all-targets -- -D warnings

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
    - name: harden runner
      uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
      with:
        egress-policy: audit

    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install rustfmt
      run: rustup component add rustfmt

    - name: cargo fmt
      run: cargo fmt --all -- --check
