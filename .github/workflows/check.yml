name: check

on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main

permissions:
  contents: read # Needed to checkout the repository.

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  # Only cancel superseded pull request runs, so every push to main is fully checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
    - name: harden runner
      uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
      with:
        egress-policy: audit

    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install firmware target
      run: rustup target add x86_64-unknown-none

    - name: cargo build
      run: cargo build --release --workspace

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
    - name: harden runner
      uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
      with:
        egress-policy: audit

    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install firmware target
      run: rustup target add x86_64-unknown-none

    - name: cache nextest
      id: nextest-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/bin/cargo-nextest
        key: nextest-${{ runner.os }}-${{ hashFiles('hack/ci/Cargo.lock') }}

    - name: install nextest
      if: steps.nextest-cache.outputs.cache-hit != 'true'
      # The version comes from hack/ci/Cargo.lock, which Dependabot keeps current.
      run: |
        version=$(awk '/^name = "cargo-nextest"$/ { getline; gsub(/[^0-9.]/, "", $3); print $3 }' hack/ci/Cargo.lock)
        test -n "${version}"
        cargo install --locked cargo-nextest --version "${version}"

    - name: cargo nextest
      run: cargo nextest run --release --workspace

    - name: cargo nextest without default features
      run: cargo nextest run --release -p uemulator --no-default-features

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
    - name: harden runner
      uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
      with:
        egress-policy: audit

    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install clippy
      run: rustup component add clippy

    - name: install firmware target
      run: rustup target add x86_64-unknown-none

    - name: cargo clippy
      run: cargo clippy --release --workspace --all-targets -- -D warnings

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
    - name: harden runner
      uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
      with:
        egress-policy: audit

    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install rustfmt
      run: rustup component add rustfmt

    - name: cargo fmt
      run: cargo fmt --all -- --check
