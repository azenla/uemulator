# Written into the ESP's xen.cfg by hack/xen/fatput.py; grub.cfg sources it.
menuentry "Xen" {
  insmod ext2
  search --no-floppy --file --set=root /boot/xen.gz
  multiboot2 /boot/xen.gz dom0_mem=1024M,max:1024M console=com1 com1=115200,8n1 loglvl=all guest_loglvl=all iommu=debug dom0=pvh
  module2 /boot/vmlinuz-lts root=/dev/vda2 rootfstype=ext4 rootdelay=5 rw console=hvc0
  module2 /boot/initramfs-lts
}
